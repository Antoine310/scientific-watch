name: Collecte scientifique - test manuel

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Tester les cinq sources et Gemini par lots
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          ARXIV_ENABLED: 'true'
          DBLP_ENABLED: 'true'
          DBLP_DELAY_SECONDS: '2.5'
          CROSSREF_ENABLED: 'true'
          IACR_ENABLED: 'true'
          LOOKBACK_DAYS: '90'
          # Première exécution : aucune écriture dans Notion.
          WRITE_NOTION: 'false'
          # Jusqu'à 100 candidats, analysés par lots de 10.
          MAX_AI_ARTICLES: '100'
          AI_BATCH_SIZE: '10'
          AI_BATCH_PAUSE_SECONDS: '6'
          MAX_WRITE: '3'
          MIN_SCORE: '60'
        run: python3 collect.py
