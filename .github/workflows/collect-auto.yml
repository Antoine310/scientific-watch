# V13 — Collecte programmée, relances régulières et e-mails facultatifs.
# Heures UTC : 07:30, 10:30, 14:30 (horaire local variable avec l'heure d'été).
# Les trois passages quotidiens sont intentionnels : si une API échoue,
# la prochaine exécution repart des nouveaux articles absents de Notion.
name: Veille scientifique automatique V14

on:
  workflow_dispatch:
    inputs:
      import_to_notion:
        description: 'Importer les publications prioritaires dans Notion ?'
        type: boolean
        required: true
        default: false
      publish_public:
        description: 'Publier le rapport public pendant le test hebdomadaire ?'
        type: boolean
        required: true
        default: false
      weekly_report:
        description: 'Envoyer seulement le bilan hebdomadaire ?'
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '30 7 * * *'
    - cron: '0 18 * * 0'

permissions:
  contents: read

concurrency:
  group: scientific-watch-notion
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.weekly_report || github.event_name == 'schedule' && github.event.schedule != '0 18 * * 0' && vars.AUTO_IMPORT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Compiler le Python avant toute collecte
        run: python3 -m py_compile collect.py notify.py publish_weekly.py
      - name: Rechercher, évaluer et éventuellement importer
        id: collect
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          ARXIV_ENABLED: 'true'
          DBLP_ENABLED: 'true'
          DBLP_DELAY_SECONDS: '3'
          CROSSREF_ENABLED: 'true'
          IACR_ENABLED: 'true'
          LOOKBACK_DAYS: '30'
          WRITE_NOTION: ${{ github.event_name == 'schedule' && 'true' || inputs.import_to_notion && 'true' || 'false' }}
          MAX_AI_ARTICLES: '100'
          AI_BATCH_SIZE: '10'
          AI_BATCH_PAUSE_SECONDS: '6'
          MAX_WRITE: '10'
          MIN_SCORE_CORE: '75'
          MIN_SCORE_TRANSFER: '70'
        run: python3 collect.py
      - name: Envoyer les alertes prioritaires Gmail
        if: ${{ success() && (github.event_name == 'schedule' || inputs.import_to_notion) }}
        env:
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 notify.py priority
      - name: Signaler une panne par Gmail
        if: ${{ failure() }}
        env:
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 notify.py failure

  weekly:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.weekly_report || github.event_name == 'schedule' && github.event.schedule == '0 18 * * 0' && vars.AUTO_IMPORT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Envoyer le récapitulatif des 7 derniers jours
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 notify.py weekly
      - name: Publier le rapport hebdomadaire sur le dépôt public
        if: ${{ success() && (github.event_name == 'schedule' || inputs.publish_public) }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: Antoine310/scientific-watch-v2
          PUBLIC_DRY_RUN: 'false'
        run: python3 publish_weekly.py
