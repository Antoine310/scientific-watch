name: Veille scientifique V16

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview / daily / historical / weekly'
        type: choice
        options: [preview, daily, historical, weekly]
        default: preview
        required: true
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Europe/Paris'
    - cron: '30 8 * * *'
      timezone: 'Europe/Paris'
    - cron: '0 19 * * 0'
      timezone: 'Europe/Paris'

permissions:
  contents: write # pour conserver data/ dans le dépôt PRIVÉ

# Évite deux écritures concurrentes du cache ET des index GitHub publics.
concurrency:
  group: scientific-watch-shared-state
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Déploiement sécurisé : les cron ne font rien sans activation explicite.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTO_IMPORT_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python — contrôle des fichiers
        run: python3 -m py_compile collect.py cache_v16.py history.py publish_history.py publish_weekly.py notify.py
      - name: Sélectionner le mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          SELECTED: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$SELECTED"
          elif [ "$CRON" = '0 7 * * *' ]; then
            MODE='historical'
          elif [ "$CRON" = '30 8 * * *' ]; then
            MODE='daily'
          else
            MODE='weekly'
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode sélectionné : $MODE"
      - name: Collecte quotidienne (aperçu ou réel)
        if: ${{ steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'preview' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LOOKBACK_DAYS: '30'
          WRITE_NOTION: ${{ steps.mode.outputs.mode == 'daily' && 'true' || 'false' }}
          MAX_AI_ARTICLES: '50'
          AI_BATCH_SIZE: '10'
          MAX_WRITE: '10'
          MIN_SCORE_CORE: '75'
          MIN_SCORE_TRANSFER: '70'
          DBLP_ENABLED: 'true'
          CROSSREF_ENABLED: 'true'
          IACR_ENABLED: 'true'
          ARXIV_ENABLED: 'true'
        run: python3 collect.py
      - name: Historique progressif
        if: ${{ steps.mode.outputs.mode == 'historical' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          WRITE_NOTION: 'true'
          HISTORY_DRY_RUN: 'false'
          HISTORY_END: '2026-10-28'
          HISTORY_MAX_AI: '30'
          HISTORY_MAX_PAGES: '20'
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: Antoine310/scientific-watch-v2
          PUBLIC_DRY_RUN: 'false'
        run: python3 history.py
      - name: Enregistrer le cache et la progression dans le dépôt privé
        if: ${{ always() && (steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'historical') }}
        run: |
          git config user.name 'scientific-watch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/article_cache.json 2>/dev/null || true
          git add -f data/history_progress.json data/history_records.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Veille V16 : cache et progression de recherche'
            git push
          fi
      - name: Alertes prioritaires quotidiennes
        if: ${{ steps.mode.outputs.mode == 'daily' }}
        env:
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 notify.py priority
      - name: Bilan hebdomadaire
        if: ${{ steps.mode.outputs.mode == 'weekly' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 notify.py weekly
      - name: Publication du rapport hebdomadaire
        if: ${{ steps.mode.outputs.mode == 'weekly' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: Antoine310/scientific-watch-v2
          PUBLIC_DRY_RUN: 'false'
        run: python3 publish_weekly.py
