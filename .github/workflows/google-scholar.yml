name: Google Scholar — V16.4

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false = aperçu sans écriture / true = traitement réel"
        type: choice
        options: ['false', 'true']
        default: 'false'
        required: true

permissions:
  contents: write

concurrency:
  group: scientific-watch-shared-state
  cancel-in-progress: false

jobs:
  scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Vérifier le script
        run: python3 -m py_compile google_scholar_ingest.py

      - name: Lire les alertes et traiter les références
        env:
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          WRITE_NOTION: 'true'
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: Antoine310/scientific-watch-v2
          PUBLIC_DRY_RUN: 'false'
          SCHOLAR_APPLY: ${{ inputs.apply }}
          SCHOLAR_MAIL_LIMIT: '20'
          SCHOLAR_ARTICLE_LIMIT: '10'
          SCHOLAR_LOOKBACK_DAYS: '45'
        run: python3 google_scholar_ingest.py

      - name: Sauvegarder l'état et les fiches
        if: ${{ always() && inputs.apply == 'true' }}
        run: |
          git config user.name 'scientific-watch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/article_cache.json data/scholar_records.json data/scholar_mail_state.json data/scholar_review.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Veille V16.4 : alertes Google Scholar'
            git push
          fi
